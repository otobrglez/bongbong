# Linker flags for the wasm32-unknown-emscripten (web) build. Cargo drops
# `cargo:rustc-link-arg` from raylib-sys's build script for rlib targets, so
# these have to live here instead. See CLAUDE.md's web build section and
# ../sola-raylib/book/src/web.md for the full rationale.
[target.wasm32-unknown-emscripten]
rustflags = [
    # raylib's web backend uses emscripten's bundled GLFW3 port.
    "-C", "link-arg=-sUSE_GLFW=3",
    # Let the wasm heap grow on demand instead of aborting on OOM.
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    # raylib's image loader reaches `fopen` through macros emcc's
    # tree-shaker sometimes misses. Force the FS layer in.
    "-C", "link-arg=-sFORCE_FILESYSTEM=1",
    # Match the wasm-EH ABI rustc 1.93+ emits. Without this, link fails on
    # `__cxa_find_matching_catch_*`.
    "-C", "link-arg=-sSUPPORT_LONGJMP=wasm",
    # Recent emcc tree-shakes these aggressively; without them raylib's GLFW
    # glue and the shell's heap access hit "Module.X is undefined" at runtime.
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=['ccall','wasmMemory','HEAPU8','HEAP32','HEAPF32']",
    # Bundle static/ (sprites + shaders) into the wasm's virtual filesystem
    # at /static, so `rl.load_texture(&thread, "static/tanks.png")` resolves
    # unchanged on web.
    "-C", "link-arg=--preload-file",
    "-C", "link-arg=static@/static",
    # EXPERIMENTAL: normally skipped (the game loop runs via
    # sola_raylib::core::game_loop::run/emscripten_set_main_loop_arg, not a
    # blocking `while` pattern, and there's no audio yet - see CLAUDE.md),
    # since it costs real wasm size and per-call overhead. Turned on here to
    # try letting `Game::init`'s spawn-placement loop (and anything else
    # synchronous) yield mid-frame instead of relying on it staying bounded.
    "-C", "link-arg=-sASYNCIFY=1",
    # The wasm shadow stack. emscripten's default is 64 KB, which `app::run`
    # (a ~20 KB frame: every texture handle, the session and the loop closure
    # are its locals) plus raylib's PNG decoder already exceed. An overflow
    # is silent in a release build - the stack sits just above the static
    # data, so it corrupts stb_image's tables and the only symptom is
    # "IMAGE: Failed to load image data" on a valid PNG. 4 MB is what native
    # threads get. dev-tools builds add -sSTACK_OVERFLOW_CHECK=2 (build.rs),
    # which turns an overflow into an abort that names the stack limits.
    "-C", "link-arg=-sSTACK_SIZE=4194304",
]

# iOS (docs/ios-native-port-prd.md). Same nix trap as emscripten: the shell's
# `cc` is nix's host-wrapped clang, which injects a macOS sysroot and links
# an iOS binary against MacOSX.sdk (the simulator target fails outright, the
# device target links with "built for macOS" warnings). Link with Apple's
# clang shim instead, which picks the iPhoneOS/iPhoneSimulator SDK from the
# `-target` triple rustc passes. Build with
# DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer and SDKROOT unset,
# since devenv exports both pointing at the nix apple-sdk.
[target.aarch64-apple-ios]
linker = "/usr/bin/clang"

[target.aarch64-apple-ios-sim]
linker = "/usr/bin/clang"

[env]
# devenv/nix's C toolchain sets a global CC pointing at a host-wrapped clang
# (which injects Darwin/hardening flags like -fzero-call-used-regs that
# `emcc` rejects for wasm32-unknown-emscripten). cc-rs prefers a
# target-specific CC_<target> over the generic CC, so pin these to the real
# emscripten wrappers - this is what raylib-sys's own rgui build step (which
# compiles C directly via cc-rs, not through emcmake) actually picks up.
CC_wasm32_unknown_emscripten = "emcc"
CXX_wasm32_unknown_emscripten = "em++"
AR_wasm32_unknown_emscripten = "emar"
# Same for the iOS targets, so cc-rs (raylib-sys's C build) uses Xcode's
# clang rather than the nix wrapper.
CC_aarch64_apple_ios = "/usr/bin/clang"
CXX_aarch64_apple_ios = "/usr/bin/clang++"
AR_aarch64_apple_ios = "/usr/bin/ar"
CC_aarch64_apple_ios_sim = "/usr/bin/clang"
CXX_aarch64_apple_ios_sim = "/usr/bin/clang++"
AR_aarch64_apple_ios_sim = "/usr/bin/ar"
