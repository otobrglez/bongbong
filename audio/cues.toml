# The cue manifest (docs/sound-system-prd.md section 4.8): every sound the
# game plays, and how. Read by `audio::cues`, embedded in the binary.
#
# A [sample.<id>] is a set of sound files (its takes, under static/audio/)
# and the recipe that made them: the prompt after the style prefix, the
# ElevenLabs parameters, and each take's provenance. `status` is where it
# stands: planned (wanted, not made), review (takes made, not picked),
# approved (picked, processed, shipped), placeholder, rejected.
#
# A [cue."<id>"] is a behaviour: its bus, kind, priority, audibility class
# (section 4.3), polyphony, cooldown, level, and the samples it layers by
# distance. Ids are dotted, general to specific; a cue the game asks for
# that is not here falls back to its parent (`hit.shell.metal.iron` ->
# `hit.shell.metal` -> `hit.shell`).
#
# The `sound-gen` skill makes the planned samples; the `sound-audit` skill
# adds what a new feature needs. Edit by hand freely: a dev build reloads
# this file while it runs.

[style]
model = "eleven_text_to_sound_v3"
prefix = "close-mic, dry, punchy, realistic"

