# Deploys the Astro site (see justfile's build-web, site/README.md, and
# CLAUDE.md's "Web / wasm build" section) as a Cloudflare Worker with static
# assets — this is a pure static site, no Worker script (`main`) needed.
# The wasm/js/data build artifacts are baked into site/dist/ as part of
# `just build-web`, not deployed separately.
#
# Matches the "bongbong" Worker already live at bongbong.io (previously
# deployed manually via the Cloudflare dashboard); this file lets
# .github/workflows/cloudflare-deploy.yml (`wrangler deploy`) reproduce
# that same deploy from CI on every tagged release.
name = "bongbong"
compatibility_date = "2026-08-18"

[assets]
directory = "site/dist"
