[package]
version = "0.0.14"
name = "bongbong"
edition = "2024"
default-run = "bongbong"
repository = "https://github.com/otobrglez/bongbong"

[dependencies]
clap = { version = "4", features = ["derive"] }
hecs = "0.11"
rand = "0.10.2"
rapier2d = "0.35.2"
serde = { version = "1.0.229", features = ["derive"] }
sola-raylib = { version = "6.3.0" }
toml = "0.8"

# Dev-only battlefield map editor (docs/map-editor-design.md) - off by
# default so it never ships in a release build. Enable with
# `cargo run --features map-editor -- --editor`.
[features]
map-editor = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
