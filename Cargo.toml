[package]
version = "0.1.0"
name = "bongbong"
edition = "2024"
default-run = "bongbong"
repository = "https://github.com/otobrglez/bongbong"

[dependencies]
clap = { version = "4", features = ["derive"] }
hecs = "0.11"
rand = "0.10.2"
rapier2d = "0.35.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# The drawing crate, behind the `render` feature (below): the simulation,
# the probe and the tests never name it.
sola-raylib = { version = "6.3.0", optional = true }
toml = "1"

# iOS (docs/ios-native-port-prd.md, CLAUDE.md's iOS section): raylib (SDL
# backend, OpenGL ES 2.0) and a static SDL3 are prebuilt for the simulator
# by tools/setup_ios.sh and linked by build.rs. `nobuild` skips the crate's
# own cmake/link step, which would treat iOS as macOS and ask for the Cocoa
# and OpenGL frameworks; `sdl` drops its GLFW gamepad declaration. Edition
# 2024 (resolver 3) scopes these features to iOS targets only.
[target.'cfg(target_os = "ios")'.dependencies]
sola-raylib = { version = "6.3.0", features = ["nobuild", "sdl"], optional = true }

# Android (docs/android-port-prd.md, CLAUDE.md's Android section): raylib's
# own Android platform, prebuilt by tools/setup_android.sh and linked by
# android/build.rs. `nobuild` skips the crate's Android cmake branch, which
# mis-parses the API level from the target triple and emits none of the
# link args raylib needs; no `sdl` here, raylib drives the NativeActivity
# itself.
[target.'cfg(target_os = "android")'.dependencies]
sola-raylib = { version = "6.3.0", features = ["nobuild"], optional = true }

# The Android shared library lives in its own crate (android/) so the
# desktop builds never link a cdylib; the root package stays the default
# member, so `cargo build`/`test`/`watch` here are unchanged.
[workspace]
members = ["android", "ntk"]

[features]
default = ["render"]
# The presentation: raylib and everything that draws with it - `app`, the
# `render` module, the particle layer, the builder's chrome, the `bongbong`,
# `bbmcp` and `mapshot` binaries. On for every client build; off
# (`--no-default-features`) the crate is the headless simulation the probe,
# the tests and the room server build with no C compiler, no cmake and no
# raylib (docs/online-coop-prd.md section 4.5).
render = ["dep:sola-raylib"]
# Dev/QA-only tooling: the embedded dev server (src/devserver.rs, native)
# with its `bbmcp` MCP adapter and the debug overlays, and the `extern "C"`
# tuning API in src/capi.rs that the web page's tuning panel drives
# (docs/dev-server-design.md, docs/runtime-tuning-design.md). Off by default
# so a release build carries no writer for the tuning table and no debug
# socket (the table itself - src/tuning.rs - is always compiled; only the
# ways to drive it at runtime are gated). Enable with `--features dev-tools`
# (`just run-dev`, `just build-web-dev`).
dev-tools = []

[profile.dev]
opt-level = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
opt-level = 3

# The windowed game needs the renderer; `probe` stays auto-discovered and
# builds without it.
[[bin]]
name = "bongbong"
path = "src/main.rs"
required-features = ["render"]

# The MCP adapter for the dev server (src/devserver.rs,
# docs/dev-server-design.md). Gated on `dev-tools` so a plain build - and
# a cargo-dist release archive, which builds without features - never
# carries it.
[[bin]]
name = "bbmcp"
path = "src/bin/bbmcp.rs"
required-features = ["dev-tools", "render"]

# The map thumbnail tool (docs/mapshot-prd.md) decodes and encodes PNGs
# through raylib's image functions.
[[bin]]
name = "mapshot"
path = "src/bin/mapshot.rs"
required-features = ["render"]
