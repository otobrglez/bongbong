<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>bongbong tanks!</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #FFF;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
            display: grid;
            place-items: center;
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        .intro {
            font-size: 0.9em;
            line-height: 0.3em;
            color: #CCC;
            text-align: center;
        }
    </style>
</head>
<body>
<canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
></canvas>

<div class="intro">
    <p>Use arrow keys <kbd>←</kbd>, <kbd>→</kbd>, <kbd>↑</kbd>, <kbd>↓</kbd> to the move tank. <kbd>Space</kbd> to fire and <kbd>r</kbd> to restart the game. </p>
    <p>Please feel free to reach out with your ideas and feedback. @otobrglez</p>
</div>
<script>
    window.addEventListener("click", function () {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        [Ctx, Module && Module.audioContext].forEach(function (ctx) {
            if (ctx && ctx.state === "suspended") ctx.resume();
        });
    }, {once: true});
    var Module = {
        canvas: document.getElementById("canvas"),
        print: function (t) {
            console.log(t);
        },
        printErr: function (t) {
            console.error(t);
        },
    };
</script>
<script src="__BONGBONG_BIN__.js"></script>
</body>
</html>
