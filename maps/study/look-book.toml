# look-book - every contact a biome has to draw, once, on a small field
# (docs/biomes.md). Hand-authored: re-saving from the builder would drop
# these comments.
#
# A two-cell ford runs down columns 9-10, broken by the road along row 6; a
# lake at 17-22 x 1-4 has open water in its middle (18-21 x 2-3); a wood
# stands in the south-west, willows and birches on the banks; a run of
# glass, brick, timber, concrete and iron stands on row 9; tall grass, four
# crates and the bong fill the rest. A sandbox: no enemies and nothing to
# win - a fixture for screenshots and the palette card, not a level.

