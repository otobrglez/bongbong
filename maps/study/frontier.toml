# frontier - a 96 x 54 study map for docs/large-maps-follow-camera.md.
# Not shipped and not a level: under the same-area rule a phone shows about
# 35 x 16 cells of it, so it is three screens wide and three tall and needs
# the follow camera that document describes. A walled fort with the frog in
# the centre-south, a town of brick, iron and glass to the north-east, a
# river out of the northern hills into a lake, forests north-west, south-west
# and east, ruins to the west, a fenced oil depot with fuel drums and an oil
# trail to the south-east, two portals linking the south-west forest to the
# town, enemy towers on the roads, and eight gates round the edges.
# Protect on the waves plan. Generated once by a script and then kept as a
# file; edit it like any other map.

