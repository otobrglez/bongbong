# ai-portal-heist - two bunkers, four portals, one gamble. Hand-authored (generated
# from an ASCII layout): re-saving from the map editor would drop these
# comments. Level tables as dotted keys on purpose.
# 
# Hunt on the band plan, five tanks, the player in a longbow. The player's
# frog sits in an iron bunker bottom-left, the enemy frog in one top-right,
# each with a five-cell door. Four portals (docs/teleporting.md) - one
# beside each bunker door and two in the open middle - share one network,
# and where a tank comes out is random: a hop from the middle may drop you
# at the enemy's door or straight back at your own. Sandbags cover each
# door from the outside, tall grass and trees break the long sight lines a
# longbow loves. Frog health on each side of the middle, laser top-left,
# health and ammo in the open.

