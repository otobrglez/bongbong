# seeker-outposts: a desert showcase for the seeker missiles. Hand-authored:
# re-saving from the map editor would drop these comments. Level keys are
# dotted on purpose - a `[mission]`/`[spawn]` header would swallow every
# `cells.` line after it.
#
# Destroy on the band plan, six tanks. West to east:
#   - The player's camp on the west edge: the start, two seeker-missile
#     pickups flanking it, ammo and health behind it, a caravan track
#     running east along the middle row.
#   - A small oasis north of the track (a stream with reeds and two palms)
#     and a dry wash of scrub south of it.
#   - Six outposts spread over the east two thirds, each dug in behind cover
#     that faces the camp: brick walls north and south, an iron barrier in
#     the middle, sandbag berms, a fenced depot. A shell from the camp stops
#     on the cover; a missile flies over it and comes down on whoever sits
#     behind. Fuel and oil drums beside four of them chain the blasts.
# Obstacles stand three free cells apart so every lane routes (the nav grid
# pads a solid cell one cell to its left and above).

version = 1
size = [34, 17]
theme = "desert"
tanks = 6
tank = "titan"
mission.kind = "destroy"
spawn.kind = "band"

