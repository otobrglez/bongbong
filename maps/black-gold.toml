# black-gold - an oil refinery wired with fuses - one spark and the yard goes up
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the waves plan: six waves of 2 to 7 tanks, light to super,
# through three gates on the north edge and two on the east. The refinery is
# wired with fuses - oil trails run from drum to drum along the pipe racks, so
# one shell into the wrong barrel lights a fire that walks the trail and sets
# off everything it reaches.
#
# Two iron storage tanks with glass hatches joined by an overhead pipeline, a
# cooling pond, a glass-and-brick control room and a fenced drum yard; the
# player holds the loading yard in the south-west among the timber pallets.
# Flamethrower and missiles in the yards, health and ammo on the service road,
# a minigun at the north gate.

