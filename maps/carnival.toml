# carnival - a striped big top, a ferris wheel, a carousel and a duck pond
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the band plan, eight tanks. The fair is in town: a big top striped
# timber and glass like a pinwheel fills the middle, a ferris wheel of drums
# in the north-west, a carousel in the north-east, a duck pond with its boats
# in the south-west and a row of prize stalls along the south promenade.
# Iron crowd barriers stand in both lanes beside the big top and along the
# north and south midways, with sandbag emplacements at the south midway's
# ends: hard cover for both sides, so the fair is fought corner to corner.
#
# Every prize is a pickup: the good ones - laser, missiles, a shield - wait at
# the big top's doors; plasma at the carousel, a flamethrower at the stalls,
# health and ammo along the midway.
#
# Scaled 1.5x from the 36 x 18 original by tools/scale_map.py (thin walls, bridged lines, single pickups); the
# cell coordinates above are the original's.

