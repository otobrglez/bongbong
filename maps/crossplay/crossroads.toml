# maps/crossplay/ - size studies for the shared cross-play battlefield
# (docs/fullscreen-resolution-research.md, "one world per match"; the
# recommended standard is arena.toml's 28x14). 24x14 cells =
# 768x448 world px; the game has no map size field yet, so play it with
# `cargo run -- --map maps/crossplay/crossroads.toml --resolution 768x448`.
# Hand-authored: re-saving from the map editor would drop these comments.
#
# crossroads: an open Protect arena. A road ring around the frog with the
# player beside it, wood screens on both flanks, glass/iron caps top and
# bottom, barrels in the corners. Every corridor is at least three cells.

