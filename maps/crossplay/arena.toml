# maps/crossplay/ - battlefield maps at the shared cross-play size
# (docs/fullscreen-resolution-research.md, "one world per match"). A
# mobile player and a desktop player see the same battlefield, so every
# map in a match must be comfortable on the smallest screen in it; the
# research's recommended standard is 28x14 cells (896x448 world px, 2:1),
# with 32x16 as the large variant. The map format has no size field yet,
# so play this one with
# `cargo run -- --map maps/crossplay/arena.toml --resolution 896x448`.
# Hand-authored: re-saving from the map editor would drop these comments.
#
# arena: the 28x14 reference layout. Brick brackets on both ends with an
# iron pillar in each corner, a sandbag line inside each bracket, wood
# screens either side of a small road ring at the centre, fences on the
# midline, pickups in the four corners and along the bottom row.

