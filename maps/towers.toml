# towers - the shipped defence towers map (docs/defence-towers-prd.md).
# Hand-authored: re-saving from the map editor would drop these comments.
# The level tables are dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Hold the base. The frog sits in a sandbag pen on the left with the
# player's three towers round it - a tesla coil on the pen's mouth, a gun
# tower above and a bio slush mortar below - and four waves, light to
# heavy, roll in through the two gates on the right edge. The enemy has its
# own three dug in behind a brick line on the right, between the gates and
# the field: knock them out from outside their reach, or drive past
# quickly. A tower pack sits just out of the pen (it mends the player's
# towers and puts out a fire), health and ammo top and bottom, a shield in
# the middle for the push. Two short streams wash ooze off. The start sits
# a third of the way in rather than on the edge, which is what keeps the
# waves off the border lanes.

version = 1
size = [48, 24]
mission.kind = "protect"
spawn.kind = "waves"
spawn.waves = 4
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "heavy"

