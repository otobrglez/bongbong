# archipelago - island hopping: shallow fords, a treasure islet and a portal network
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Hunt on the band plan, six tanks. The field is a warm sea of four islands:
# the player's frog keeps the west island, the enemy's the east one, and the
# north and south islands join them through fords two cells wide that slow
# every hull to a wade. The deep water between stops a tank but never a shell.
#
# A portal on each home island and one on the treasure islet in the lagoon,
# the only way onto it: laser, missiles and a shield wait there for whoever
# risks the jump - and the exit is a coin toss. Palm groves, reed beds and
# fishing huts on every shore.

