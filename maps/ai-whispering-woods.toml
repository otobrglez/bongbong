# ai-whispering-woods - a stealth field for one or two players. Hand-authored (generated
# from an ASCII layout): re-saving from the map editor would drop these
# comments.
# 
# Protect on the band plan, six tanks, the player in a wraith and player
# two in a scout (`start2` painted beside the road). A dirt road runs down
# the middle; everything else is tall grass in big drifts and 2x2 groves of
# trees and pines. Concealment is a cell test (`Terrain::conceals`): a tank
# sitting in the grass is not seen, not chased and not rammed until it
# fires or gets hit, so the frog beside the road can be defended from
# ambush rather than from a wall. Frog health on both flanks, health top
# left, ammo in two corners, a speed-up and a shield bottom right.

version = 1
tank = "wraith"
tank2 = "scout"
tanks = 6
mission.kind = "protect"
spawn.kind = "band"

