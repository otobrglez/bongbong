# scrapyard - junk piles, wrecked cars, a crane and a crusher behind the wire
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the waves plan: five waves of 2 to 6 tanks, light to super,
# coming through the yard's three gates in the wire. Inside, everything is
# cover and nothing lasts: heaps of scrap iron, timber and glass, rows of
# wrecked cars, a crane with its magnet down, a hydraulic crusher and drums
# everywhere, some of them sitting in their own oil.
#
# The player starts at the office trailer in the south-west corner.
# Flamethrower and minigun in the heaps, missiles by the crusher, health and
# ammo round the office, a shield out by the crane.
#
# Scaled 1.5x from the 34 x 17 original by tools/scale_map.py (thin walls, bridged lines, single pickups); the
# cell coordinates above are the original's.

