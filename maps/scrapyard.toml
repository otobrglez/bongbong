theme = "desert"
tank = "ravager"
tank2 = "breaker"
mission.kind = "destroy"
spawn.kind = "waves"
spawn.waves = 5
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "super"

