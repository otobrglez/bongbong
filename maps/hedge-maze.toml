# hedge-maze - a formal garden labyrinth of pine hedges round a fountain court
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the band plan, seven tanks, in a scout. A mirrored garden
# labyrinth of pine hedges with gravel walks three cells wide - room for a
# tank to turn - winds from the four corners to a fountain court where the
# frog lives. The walks loop, so there is always a second way round, and the
# hedges burn and flatten: a shortcut is a shell or a ram away.
#
# Laser and missiles in the two blind pockets, shield and frog health in the
# court, health and ammo in the corner walks, flower beds of tall grass to
# hide in along the galleries.

