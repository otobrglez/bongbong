# Shieldbreak Depot. A Protect playtest for the shield, armour and grenade patch.
# Take the middle shield for an exposed firing lane. The west lane has grenades,
# an iron blast screen and a breakable approach. The east lane has an EMP and
# a way around the depot. The two waves approach through the north gates.
version = 1
view = "whole"
size = [36, 20]
tank = "scout"
bong = "oggle"
theme = "desert"
weather = "clear"

[mission]
kind = "protect"

[spawn]
kind = "waves"
waves = 2
size = 2
growth = 1
tier_start = "light"
tier_end = "medium"

