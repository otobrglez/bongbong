# glasshouses - Victorian glasshouses, a lily pond and the frog's own glasshouse
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the band plan, four tanks: the campaign's second level, built to
# be forgiving. Two glasshouses of timber-framed glass flank the gardens, each
# with a door toward the middle and a bed of palms inside; a lily pond lies
# between them, and south of it, where the gravel walks meet, the frog lives
# in a small glasshouse of its own - iron on three sides, glass panes inside,
# and a brick door onto the south walk. A frog hops clear of any tank that
# comes near, and the double walls north and south leave it nowhere to land,
# so it stays in its house: the one way to it is through the door and the
# pane behind it, from the south walk.
#
# Glass shatters and timber burns, so the big glasshouses are cover only
# until somebody decides otherwise. Plasma and a shield in the glasshouses,
# a laser and a minigun under their eaves, missiles and a flamethrower beside
# the two starts, a second minigun and laser in the parterre, health and ammo
# in the orchard and the far corners, two more health packs by the frog's
# door and frog health beside the house, a shield on the pond's north bank
# and a speed-up on the long walk.

