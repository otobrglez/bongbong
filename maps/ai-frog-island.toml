# ai-frog-island - the frog on a moated island. Hand-authored (generated from an
# ASCII layout): re-saving from the map editor would drop these comments.
# 
# Protect on the band plan, six tanks, the player in an assault. The frog
# and the player start on an island ringed by a three-cell moat: the moat's
# middle line is deep water (docs/water.md) - a wall to hulls, nothing to
# shots - so the only ways on are the two two-cell road causeways north
# and south, and their ends are fords that slow a hull to a crawl. Two
# rivers run the full height of the field down cols 5 and 28: a tank
# crossing one is carried south, and a tank wading along one drifts off
# its line. Sandbags stand at the outer end of each causeway for the
# attackers, tall grass on the island for the defender. Frog health packs
# sit past the rivers on either side, ammo beside them, health top centre,
# a shield bottom centre.

