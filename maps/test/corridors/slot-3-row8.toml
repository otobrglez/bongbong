# maps/test/corridors/ fixture - a single east-west iron divider at col 20
# with one horizontal slot through it, so corridor width is the only
# variable. Hand-authored: re-saving from the map editor would drop these
# comments.
#
# Geometry, for editing these by hand: a wall tile's centre sits at
# (col*32, row*32), and the nav grid's cells are the same 32px pitch
# anchored half a cell away, so each wall row blocks the two nav rows
# either side of it. A slot of k free map rows therefore leaves k-1 open
# nav rows, and needs k >= 2 to leave any at all.
#
# slot-3-row8: the same three-map-cell (96px) slot as slot-3-row9,
# shifted one row up. Under the old 48px nav grid this one was sealed
# while slot-3-row9 routed - same width, different answer. Both must
# route now.


version = 1
size = [40, 22.5]
tanks = 4
mission.kind = "protect"
spawn.kind = "band"

# player right of the divider, frog left, so neither ever plugs the slot
cells."30,11" = { kind = "start" }
cells."8,11" = { kind = "frog" }

# the divider: col 20, every row but the slot (8..10)
cells."20,0" = { kind = "wall", material = "iron" }
cells."20,1" = { kind = "wall", material = "iron" }
