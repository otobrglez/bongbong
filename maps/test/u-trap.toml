# maps/test/ fixture - an adversarial layout provoking one known failure
# class; see docs/gameplay-verification-design.md #2.2. Hand-authored:
# re-saving from the map editor would drop these comments.
#
# u-trap: a U-shaped cul-de-sac, mouth facing the top spawn band,
# player start due south behind the bar - naive straight-line
# steering enters the pocket and has to escape back north and
# around (stuck-escape / committed-heading override territory).

version = 1
size = [40, 22.5]
# view = "whole": drawn at 40 x 22.5 when that was the standard field,
# this fixture is shown whole and played by the arena's AI - the shared
# alert and the edge band its probe-fixtures budgets were measured on.
# The field-map AI (docs/large-maps-follow-camera.md section 12) is swept
# on the field maps themselves by `just probe-fields`.
view = "whole"
tanks = 4

