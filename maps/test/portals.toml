# maps/test/ fixture - the portal network (docs/teleporting.md). Hand-
# authored: re-saving from the map editor would drop these comments. The
# level tables are dotted keys on purpose - a `[mission]`/`[spawn]` table
# header would swallow every `cells.` line after it.
#
# portals: two rooms split by a full-height iron column (col 20) and joined
# by nothing but a portal on each side ((15,11) and (25,11), each with a
# clear 3x3 around it). The player and the frog live on the left; three
# waves of two roll in through two gates on the right edge, spread well
# apart (rows 5 and 17) so a wave's pair does not arrive shoulder to
# shoulder and circle each other on the way to the same portal. Every
# enemy has to route through the portal to reach the frog, so this is the
# standing check that the planner's hub routing works and that the linter
# sees one playfield through the network: `just probe-fixtures` sweeps it
# at the shared budgets (never-arrived=0, low-progress=0), and maplint
# expects no errors, no portal-alone/portal-blocked and no disconnected
# region. Brick pairs on each side are cover, not lanes.

