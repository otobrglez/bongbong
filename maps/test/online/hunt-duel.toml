# maps/test/online/hunt-duel.toml - the fixture the online co-op tests end a
# round with (src/net/rig.rs, server/tests/round.rs). It sits in a
# subdirectory on purpose: `just probe-fixtures` globs maps/test/*.toml, and
# this map is not an AI fixture - it has no enemies and nothing to steer.
#
# A Hunt with nobody on the field but the seats and the enemy frog at the head
# of a one-cell iron shaft four cells up player one's barrel. An evasive hop
# clears a wall as long as it lands somewhere it fits, so the shaft is walled
# three rows deep and the only landing left is further down the lane, toward
# the tank the frog is hopping away from: it stays in the line of fire and a
# pulled trigger wins the round in well under a second, whatever seed it runs
# on. That is what makes the end screen and what follows it testable in a few
# seconds of wall clock.
#
# Hand-authored: re-saving from the map editor would drop these comments.

version = 1
size = [14, 8]
tanks = 0
mission.kind = "hunt"
spawn.kind = "band"

cells."7,5" = { kind = "start" }
cells."5,5" = { kind = "start2" }
cells."7,1" = { kind = "enemy_frog" }
cells."1,1" = { kind = "wall", material = "iron" }
