# maps/test/ fixture - the destructible props playground (sandbags, barrels,
# fences: docs/sandbags-barrels-fences.md). Not an adversarial layout like
# its neighbours, but swept by `just probe-fixtures` all the same so a prop
# rule can never quietly break the AI. Hand-authored: re-saving from the
# map editor would drop these comments.
#
# props: a sandbag line (row 8) and a fence line (row 14) the player can
# shoot over / at / ram from the start cell; a 2x2 barrel cluster (cols
# 20-21, rows 10-11: two pinned oil drums and two pinned fuel drums, so a
# chain there launches - docs/barrel-explosion-variety.md B2) and a
# 3-in-a-row chain of rolled barrels (cols 8-10, row 16) for chain
# reactions; a lone fuel drum (24,6) at the end of an oil trail (row 6,
# cols 18-23) that starts beside a lone oil drum (17,6) - one shot at the
# oil drum and the fire runs the trail to the fuel drum; a vertical
# sandbag run (col 6) and a vertical fence run (col 26) so the axis pick
# has both cases; two brick tiles (row 11) for comparison. Lanes stay at
# least 3 cells wide and the spawn band is clear, so the AI is never
# forced through a prop.

