# ai-powder-keg - a refinery that wants to burn. Hand-authored (generated from an
# ASCII layout): re-saving from the map editor would drop these comments.
# 
# Protect on the band plan, five tanks, the player in a breaker. The frog
# sits in a sandbag ring (cols 10-24, rows 5-11) with three-cell gaps on
# all four sides and an oil drum in each front corner - pop one while a tank
# is squeezing through and the gap becomes a pool of fire. Four wood-walled
# depots hold a pinned fuel drum each; an oil trail runs from every depot
# to a loose barrel behind a fence line, so one stray shot at a depot sends
# a fuse crawling toward the middle of the map (and a fuel drum lit by a
# blast launches). Tall grass tufts by the fences hide a tank waiting for
# the trail to arrive. Flamethrower on the left, health on the right, ammo
# top and bottom, a shield in the bottom lane.

