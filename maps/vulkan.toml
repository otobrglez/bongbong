# vulkan - the volcano in the middle (docs/volcano.md), level 2
# Saved from tools; re-saving from the builder drops these comments, so
# put them back.
#
# Protect on the band plan, five tanks, the sky dusk falling into night at
# ninety seconds of the round (`nightfall`). The volcano stands in the
# middle of the field and erupts every half minute, throwing lava bombs
# round itself and at any tank in range; three rivers of lava leave it -
# west into a lava lake whose middle is deep, north-east off the east
# edge, south off the bottom - each a burning ford crossed at a wade, with
# a stone crossing on each (a road cell) where the roads meet them.
#
# The players start in the south-east by the frog's sandbag ring. Lamp
# posts stand round the base, at every crossing and up the roads: at night
# they light the way, and show whoever stands in them to the enemy. Three
# heat shields lie by the rivers; trees on the banks catch fire when an
# eruption's surge comes past.

version = 1
tanks = 5
tank = "warden"
tank2 = "scout"
weather = "dusk"
nightfall = 90.0
mission.kind = "protect"
