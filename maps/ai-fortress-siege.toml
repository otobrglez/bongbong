# ai-fortress-siege - hold the fort through six waves. Hand-authored (generated from an
# ASCII layout): re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would swallow
# every `cells.` line after it.
# 
# Destroy on the waves plan: six waves of 3 to 8 tanks, medium -> super,
# through two gates on each of the top, left and right edges. The player
# holds an obelisk in a brick fort (cols 12-27, rows 6-16) with iron
# corners, glass slits and a three-cell door on every side. Fuel drums stand
# outside every door: a wave bunching up at a door is one shot from a
# fireball. Sandbag outworks on the flanks and in the top and bottom lanes
# give the player somewhere to sortie to - laser and plasma wait in the
# top corners, minigun and a speed-up in the bottom ones, health, ammo and
# a shield inside the walls.

version = 1
size = [40, 22.5]
tank = "obelisk"
mission.kind = "destroy"
spawn.kind = "waves"
spawn.waves = 6
spawn.size = 3
spawn.growth = 1
spawn.tier_start = "medium"
spawn.tier_end = "super"

