# The default battlefield: 34 x 17 cells (1088 x 544), the cross-play
# standard (docs/fullscreen-resolution-research.md) - the largest field a
# landscape phone still shows at a 7 mm tank, and on a desktop under the
# 1.5x view cap two thirds of a 1080p screen. Protect mission on the
# waves plan: the frog sits in a brick bunker at the bottom centre, open
# at the top between two iron corners, both players' starts beside it;
# brick towers and glass caches on both flanks, a road ring, iron and
# wood screens either side of the middle lane, pines, trees and tall
# grass for cover. The bottom corners hold only ammo, so a thumb
# steering on a phone covers nothing that has to be watched.
# Hand-authored: re-saving from the map editor would drop these comments.
# The old 40 x 22.5 map is maps/classic.toml.

version = 1
size = [34, 17]
tank = "assault"
mission.kind = "protect"
spawn.kind = "waves"
spawn.waves = 4
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "super"

