# bongbong's default battlefield - loaded automatically whenever the game is
# started without -m/--map (see main.rs's default_map()). Hand-authored, not
# generated - a modest scatter of wall clusters (one small cluster per
# material) plus a frog and four pickup slots, leaving the center open for
# the player's spawn. Edit with `cargo run --features map-editor -- --editor
# --map maps/default.toml`.
version = 1

