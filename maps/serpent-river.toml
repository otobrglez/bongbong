# serpent-river - a broad river snakes across the valley between two frog camps
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Hunt on the band plan, seven tanks, in a longbow. A broad river two cells
# wide snakes down the valley from the north edge to the south, shallow along
# its whole length - every bank is a ford, and every ford slows a hull to a
# wade - with a road bridge below the bend for the fast way over. The player's
# frog keeps a meadow camp on the west bank, the enemy's a walled farm on the
# east.
#
# Pine forests crowd both banks, a timber watermill sits on the bend, fields
# behind fences, reed beds along the water. Long sight lines down the river
# for the longbow; laser and missiles on the far bank's hills.

