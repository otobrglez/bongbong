# maps/missions/ fixture - a clean starting point for one mission/spawn
# combination; see docs/maps-to-levels.md. Hand-authored: re-saving from
# the map editor would drop these comments. The level tables are written
# as dotted keys on purpose - a `[mission]`/`[spawn]` table header would
# swallow every `cells.` line after it.
#
# forage-basic: the mushroom hunt (docs/mushroom-hunt-prd.md) on the band
# plan, four tanks, no frog. Ten mushrooms are spread over the whole field,
# so picking them all up is a tour of it: one in the open north of the
# iron bar over the start, one in tall grass, one in a sandbag nest to the
# west, one in a brick pen open to the west, one behind barrels in the
# north east, one beside a pond, one among trees in the south west and the
# rest in the corners' open ground, clear of the spawn band's edge cells.
# The last mushroom wins the round, whatever is still standing.

