# maps/missions/ fixture - a clean starting point for one mission/spawn
# combination; see docs/maps-to-levels.md. Hand-authored: re-saving from
# the map editor would drop these comments. The level tables are written
# as dotted keys on purpose - a `[mission]`/`[spawn]` table header would
# swallow every `cells.` line after it.
#
# hunt-basic: Hunt mission on the band plan, four tanks. The player starts
# on the right (col 38) with its frog (col 50) behind a brick screen at
# col 42; the enemy frog sits far left (col 6) behind its own brick screen
# at col 11.
# Two iron wall segments at col 28 (rows 6-10 and 21-26) leave a ten-cell
# central gap (rows 11-20) and four-nav-cell lanes along the top and bottom
# edges, so both sides round something on the way to the other's frog
# without any single-cell corridor. A contested health pack sits in the
# gap, ammo in each open quarter, and a frog health pack in each of the
# outer lanes - either side can take one, and it only heals the frog of
# whoever picks it up (docs/frog-health-pack-prd.md).

version = 1
size = [56, 31.5]
tanks = 4
mission.kind = "hunt"
spawn.kind = "band"

cells."38,15" = { kind = "start" }
cells."50,15" = { kind = "frog" }
cells."6,15" = { kind = "enemy_frog" }

