# maps/missions/ fixture - a clean starting point for one mission/spawn
# combination; see docs/maps-to-levels.md. Hand-authored: re-saving from
# the map editor would drop these comments. The level tables are written
# as dotted keys on purpose - a `[mission]`/`[spawn]` table header would
# swallow every `cells.` line after it.
#
# waves-basic: Destroy mission on the waves plan - four waves of 2, 3, 4
# and 5 tanks climbing light -> super, rolling in through the two explicit
# gates at the middle of the left and right edges (map cols 0 and 39 sit
# on the nav grid's first and last column). No frog: Destroy spawns none.
# The player starts at the centre between four 3x3 wall blocks, two brick
# and two iron, placed so every edge lane and the centre cross stay open
# and the roll-in lanes are never walled. Ammo top and bottom centre,
# health on each gate's lane.

version = 1
mission.kind = "destroy"
spawn.kind = "waves"
spawn.waves = 4
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "super"

cells."20,11" = { kind = "start" }
cells."0,11" = { kind = "gate" }
