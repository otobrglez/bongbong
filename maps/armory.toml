# armory - the free-play arena for the BB-36 weapons (docs/sonic-hammer.md
# "The armory"). Hand-authored: re-saving from the map editor would drop
# these comments. The level tables are dotted keys on purpose - a `[spawn]`
# header would swallow every `cells.` line after it.
#
# Everything a new weapon meets in one screen. The start is on the west
# with a sonic hammer crate three cells east of it; column 7 above and
# below that crate is kept free for the crates of the weapons still to
# come, one a cell (7,4 7,6 7,10 7,12 7,14). North: a glass house with a
# shield inside it (the hammer shatters panes; an enemy wanting the shield
# has to break in), an iron block and a brick stub (walls stop the wave).
# Middle: a column of drums - oil, fuel, oil - with an oil trail running
# east, for throwing at whoever stands behind them, and a lamp post the
# wave leaves standing. South: a patch of tall grass with two trees to hide
# in and be flushed out of, and a lake with fish to scatter and throw onto
# its north bank. East: a lava ford running down from the top edge beside
# an enemy tesla, an enemy gun tower in the south-east - the trouble an
# enemy's hammer shoves a seat into, and a seat shoves enemies into - a
# brick stub by the lake and a row of sandbags the wave passes over. A
# second hammer crate on the east side is for the enemies: one firing
# shells collects it. The player's frog sits by the start beside a player
# tesla; the hunters come for it. A band of four, clear sky.

