# pocket-duel - a small, fast, point-symmetric desert arena
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the band plan, three tanks, on the smallest field in the set -
# made for a short, sharp round on a phone. The arena is point-symmetric: a
# glass pavilion round a little spring in the middle, a sand track circling
# it, timber-and-glass L-walls and brick screens in the quarters, palms and
# drum stacks in the corners.
#
# Health and ammo mirrored on both sides, a laser at the spring, speed-ups in
# two corners and a minigun on each flank.

version = 1
size = [26, 13]
theme = "desert"
tanks = 3
tank = "assault"
tank2 = "scout"
mission.kind = "destroy"
spawn.kind = "band"

