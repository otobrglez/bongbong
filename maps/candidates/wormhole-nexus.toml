# wormhole-nexus - six portals, four iron vaults and a frog in each camp
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Hunt on the band plan, six tanks. Four iron vaults stand in the corners,
# their only doors windows of glass, and a portal spins inside each; two more
# flank the plaza in the middle where the player's frog lives. Every jump
# lands at a random other portal, so a raid on the enemy frog's vault in the
# north-east is a dice roll - or a shell through the glass.
#
# Each vault holds loot: a laser, missiles, plasma beside the enemy frog, a
# shield and frog health. Health and ammo on the open sand between, drum
# stacks and sandbag cover round the plaza.

version = 1
size = [36, 18]
theme = "desert"
tanks = 6
tank = "obelisk"
tank2 = "breaker"
mission.kind = "hunt"
spawn.kind = "band"

