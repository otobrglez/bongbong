# canal-quarter - a canal town of brick blocks, bridges and a portal square on each side
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the waves plan: five waves of 2 to 6 tanks, light to heavy,
# rolling in through the four gates at the ends of the two high streets. Two
# canals cross the town north to south - fordable, but their current carries a
# stopped hull downstream - and the street bridges are the only dry crossings.
#
# Brick and timber blocks with glass windows line the streets, tree-lined
# avenues run beside the water and the frog keeps the fountain in the market
# square. A portal in each outer square throws a tank to the other side of
# town. Laser and missiles wait in those squares, health on the canal banks,
# flamethrower and speed at the town gates.

version = 1
size = [40, 20]
tank = "assault"
tank2 = "warden"
mission.kind = "protect"
spawn.kind = "waves"
spawn.waves = 5
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "heavy"

