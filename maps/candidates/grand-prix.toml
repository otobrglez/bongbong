# grand-prix - a racing circuit with kerbs, pit lane, grandstands and a lake infield
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the band plan, seven tanks, in a scout. A stadium-shaped circuit
# laps the field round a lake infield; speed-ups on the two straights make it
# the fastest way anywhere, and the kerbs of timber and glass on every corner
# are cover that breaks. Grandstands line the top straight, the pit garage and
# a tyre wall of sandbags sit in the infield, and the chequered banner marks
# the line.
#
# Health and ammo in the pits, missiles and a laser at the far ends of the
# infield, a shield on the island.

