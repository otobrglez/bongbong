# king-of-the-hill - a hilltop redoubt at the crossroads, attacked from eight gates
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the waves plan: six waves of 3 to 8 tanks, light to super,
# through eight gates - the four edge midpoints and four near the corners - so
# an attack can come from anywhere. The frog sits in an iron redoubt with
# glass firing ports at the crossroads of four roads, inside a ring of sandbag
# revetments; every wave has to climb to it.
#
# Four quarters around it: a pond and reeds, a copse, a timber barn with its
# paddock and a stone ruin, each with pickups. Shield and frog health in the
# redoubt, missiles and a laser in the far quarters.

