# zen-garden - raked gravel ripples round a stone island, a koi pond and a tea house
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the band plan, four tanks, on a small field. A dry garden fills
# the west: gravel raked in widening ripples round an island of iron boulders,
# straight rake lines along its edges and stone lanterns at the corners. A koi
# pond fed by a little stream lies east, beside a timber tea house with paper
# screens of glass and a stand of bamboo, reached over stepping stones.
#
# Calm to look at, mean to fight in: the boulders and lanterns are iron and
# never break, the tea house and the bamboo do. Plasma and a shield by the
# pond, health and ammo on the gravel.

