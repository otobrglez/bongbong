# glasshouse-gardens - Victorian glasshouses, a lily pond and a formal parterre
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the band plan, five tanks. Two glasshouses of timber-framed glass
# flank the gardens, each with a door toward the middle and a bed of palms
# inside; the frog sits by the lily pond at the centre, where the gravel walks
# meet, and a parterre of box hedges and flower beds fills the south.
#
# Glass shatters and timber burns, so the glasshouses are cover only until
# somebody decides otherwise. Plasma and a shield in the glasshouses, a laser
# and a minigun under their eaves, health and ammo in the orchard, frog health
# by the pond, a speed-up on the long walk.

