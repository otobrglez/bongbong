# moon-base: the shipped moon battlefield (theme = "moon" - grey regolith,
# lighter ejecta drifts, dark basalt tracks, crater chasms where water is
# painted and crystal shards for tall grass, under the lunar sky;
# docs/desert-theme.md, docs/weather.md). Generated once and then kept by
# hand: re-saving from the map editor would drop these comments. Level keys
# are dotted on purpose - a `[mission]`/`[spawn]` header would swallow
# every `cells.` line after it.
#
# Protect on the band plan, five tanks, the scout.
#   - The Mare crater fills the west: a basin of chasm a hull cannot cross
#     and a shot flies over, the minigun on its north rim.
#   - A rille runs in off the north edge and bends east: a one-cell dust
#     channel, slow and slippery to cross (a ford's rules).
#   - A crystal field stands in the open centre with the frog health pack
#     inside it, more crystals in the corners and by the crater's south.
#   - The outpost in the east: an iron ring breached west and south, two
#     fuel drums stacked against its east wall by the plasma pickup, a
#     lamp post outside its north-west corner. A basalt track leads in from
#     the north edge.
#   - The habitat at the bottom centre: two iron piers round the frog,
#     sandbags further out, two lamp posts lighting the player's start.
#     A small crater south-east of it, an iron baffle east of that, a
#     sandbag berm in the south-west.
# Every lane is at least two nav cells wide. `cargo test --lib maplint`
# holds this map to zero errors like the desert's.

version = 1
size = [48, 24]
theme = "moon"
weather = "lunar"
tanks = 5
tank = "scout"
mission.kind = "protect"
spawn.kind = "band"

