# no-mans-land - a desert front: sandbag line, iron hedgehogs, wire and flooded craters
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Destroy on the waves plan: five waves of 2 to 10 tanks, light to heavy,
# rolling in through four gates on the north edge. The player holds the
# sandbag line across the south, firing steps every few cells and timber
# dugouts behind it; north of it lies no man's land - iron anti-tank
# hedgehogs, runs of wire with gaps a hull can take, flooded shell craters and
# the shattered walls of an outpost.
#
# Missiles and a flamethrower in the dugouts, health and ammo behind the line,
# a minigun in the ruined outpost for whoever gets there first, a shield and a
# speed-up out on the flanks.

