# maps/phone/ - battlefield maps sized for a phone screen
# (docs/fullscreen-resolution-research.md, "map sizes"). 24x14 cells =
# 768x448 world px; the game has no map size field yet, so play it with
# `cargo run -- --map maps/phone/bunker.toml --resolution 768x448`.
# Hand-authored: re-saving from the map editor would drop these comments.
#
# bunker: a dense Protect map on the waves plan. The frog sits in a brick
# bunker on the left with one iron door cell; the enemy side mirrors it
# with barrels inside. Waves roll in through the right edge and the top
# and bottom gates at col 9.

version = 1
mission.kind = "protect"
spawn.kind = "waves"
spawn.waves = 4
spawn.size = 2
spawn.growth = 1

