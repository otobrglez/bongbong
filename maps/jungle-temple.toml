# jungle-temple - a jade frog idol in a jungle clearing, a waterfall and ruined shrines
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the band plan, six tanks. In a clearing ringed by jungle stands
# the idol of the frog god - a great face of jade glass with amber timber eyes
# and an iron grin - and its living namesake sits on its head, at the top of
# the map, between two iron pillars on the lane that runs behind the idol. A
# stream falls from the north-west into a pool beside the idol and wanders off
# east.
#
# The pillars and the idol shelter the frog from every side but one: the
# processional way below, where a timber tongue in the iron grin is the weak
# spot. A tank has to break the glass face and the tongue from the way to
# reach it, which is where the players start and where the frog is defended.
#
# Crumbled shrines of grey stone in the jungle, pillars along the processional
# way, vines of tall grass everywhere to hide in. Laser and missiles in the
# shrines, shield and frog health at the idol's foot, plasma in the two top
# corners, ammo in all four, a minigun and a flamethrower on the south walk,
# health by the jungle's edges.
#
# Scaled 1.5x from the 34 x 17 original by tools/scale_map.py (thin walls, bridged lines, single pickups); the
# cell coordinates above are the original's.

