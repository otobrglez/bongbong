# castle-moat - hold the keep: a moated castle besieged from every edge
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the waves plan: six waves of 2 to 7 tanks, medium to super,
# rolling in through six gates round the edge. The frog lives in the castle
# courtyard. A curtain wall with an iron tower at each corner rings it, broken
# by a gate on every side, and a moat two cells wide - shallow, so a hull can
# wade it slowly anywhere - rings the wall, with dry road bridges north and
# south.
#
# A timber-and-brick village west of the moat, a forest east, fields and
# fences south. Super-heavies to hold it: a titan and a leviathan. Shield and
# frog health in the keep's shadow, laser and missiles in the far corners
# outside the moat, health and ammo out in the village and the woods.

