size = [40, 22.5]
tank = "titan"
tank2 = "leviathan"
mission.kind = "protect"
spawn.kind = "waves"
spawn.waves = 6
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "medium"
spawn.tier_end = "super"

