# oasis-bazaar - level 4, Oasis Bazaar: a Hunt across a desert market town,
# 68 x 34 cells, followed by the camera. Spike, the players' bong, sits in
# the caravanserai yard in the west; puff, the enemy's, in a sanctum in the
# walled khan in the east. Kill puff before the hunters kill spike. The band
# is fourteen tanks; about six in ten hunt spike, the rest guard puff. Level
# tables as dotted keys on purpose - a `[spawn]` header would swallow every
# `cells.` line after it. Re-saving from the builder drops these comments.
#
# West: the yard, a sandbag berm with concrete gate posts and corners and
# three gates - north to the market, east to the bazaar, south to the street
# - each with a tesla inside it. Concrete wings run out from the north and
# south gates and a concrete bunker stands either side of the east gate; a
# concrete baffle inside the east gate keeps fire through it off the bong.
# Three gun towers: two in the east corners and one set into the north face.
# A second bong health pack and a minigun lie in the yard. The grenades,
# first met here, lie by the east gate, two of their blasts from the bong,
# and so does the first air strike, a jet, in the start's view. The market
# stalls north of the yard sell the flamethrower and plasma, as they always
# did, and a stall on the street below it the minigun. A forward sandbag
# nest east of the yard looks out over the bank the hunters come in by.
#
# Middle: the oasis, deep in its middle, fed by a stream from the north edge
# and running out by another to the south edge. Both are fords, and the two
# bazaar streets bridge them; fuel and oil drums are stacked either side of
# the north ford by its bridge and on both banks of the south stream below
# its bridge, two more wait by the bong health pack on the south shore,
# there for whichever side gets to it first, and more stand in the market
# stalls north of the yard and along both streets. Miniguns, missiles,
# grenades and speed along the north shore and the north stalls, missiles,
# plasma and the laser along the south ones, and health about the market.
#
# Air strikes: six crates, jet and helicopter turn about, on open ground
# drawn from a fixed seed - one in the start's view, then one in the west,
# one each north and south of the oasis and one each north and south of the
# khan - never in the yard or the khan.
#
# East: the khan, its back to the field's edge. Gun towers flank its west
# gate behind a sandbag barbican, with a laser lying under their guns on the
# shore and drums against the wall beside it; a tower apiece covers the two
# posterns, one at the east end of the north wall and one at the west end of
# the south wall. Drums are stacked in a niche on the outside of the north
# wall and of the south wall - shoot one and the khan is open. Inside, puff
# sits in a sanctum two cells round, brick with a glass window to the west
# and sandbags to the east, a tesla in two of its corners and a gap north
# and south to shoot through; the guards keep the yard round it, with plasma
# in front of it and the sonic hammer at the back. More grenades by the
# south postern, for lobbing over.

