# oasis-bazaar - palms round a desert spring, a market and a caravanserai with two frogs
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Hunt on the band plan, six tanks. A spring-fed pool with palm groves on its
# banks fills the middle of the field; the player's frog keeps the west
# market, the enemy's the east caravanserai, so every raid rounds the oasis or
# wades its shallows.
#
# Market stalls of timber and glass behind fence awnings, drum stacks and
# sandbag berms, caravan roads winding in from the edges and dry scrub in the
# dunes. Flamethrower and plasma in the market, missiles in the caravanserai
# yard, frog health on both sides of the water.

