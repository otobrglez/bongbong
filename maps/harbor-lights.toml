# harbor-lights - a fishing harbour: warehouses, piers, moored boats and a lighthouse
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the band plan, six tanks. The south of the field is a bay of deep
# water - no hull crosses it, every shell does - with timber piers reaching
# out, fishing boats moored between them and a white lighthouse on the rocky
# point. A river runs down through the town into the bay, its current pushing
# any hull that stops in it toward the sea.
#
# Brick warehouses with glass skylights line the quay, a fish market of stalls
# and drums sits by the river and the frog suns itself on the beach. Shield
# and frog health on the quay, missiles by the lighthouse, laser in the
# warehouse yard, health and ammo up in the town.
#
# Scaled 1.5x from the 40 x 22.5 original by tools/scale_map.py (thin walls, bridged lines, single pickups); the
# cell coordinates above are the original's.

