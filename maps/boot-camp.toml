# boot-camp - the training stage, level 0 (docs/training-stage.md)
# Saved from the builder drops these comments; put them back after a save.
#
# Five pens along one east-west road (row 11), the frog the only guide: it
# starts in pen 1 and hops on to each beat's cell as the doors open.
# Pen 1 (cols 0-9): drive over the three flags; door 1 opens. Pen 2 (cols
# 11-18): no shells until the ammo crate; door 2 opens. Pen 3 (cols
# 20-27): a firing range of wood and brick, and a brick wall across the
# road in column 25 - shooting it opens door 3, two cells behind it; the
# lane round the wall is open, so the course lints as it plays once its
# doors open. Pen 4 (cols 29-39): the drum range. North of the road, four
# rows clear of it, a lone oil drum (31,7), an oil trail east of it and a
# cluster of two oil and two fuel drums (35-36, 6-7) under a wooden shed,
# with a fence, wood and brick by them: one shot at any drum sets the rest
# off - the oil drums burn, the trail carries the fire, the fuel drums are
# thrown north and east and blast where they land. The frog watches from
# behind sandbags in the south (33,15); door 5 opens once the last drum has
# gone up. Pen 5 (cols 41-59): the frog's pad, a pond and sandbag cover; a
# shell from the east gate hurts the frog, its kit drops, then a scout
# rolls in through the gate that goes for the frog, then a shield drops
# and a scout that fights back follows.
#
# The course runs through rows 5-17 of the 60 x 24 field. The iron pen
# walls run the whole height, so no door can be driven round, and the
# ground above and below the course is landscape: woods of trees and pines
# thickening toward the map's edges, tall grass along the course and three
# ponds.
#
# Training is never lost: a wrecked tank comes back in the last door
# opened, a fallen frog gets up and its beat starts again. No enemy at the
# start (`tanks = 0`), so only the script brings any.

version = 1
tanks = 0
tank = "glacier"
size = [60.0, 24.0]
mission.kind = "protect"
spawn.kind = "band"

