[training]
start_health = 0.6
start_shells = 0

[[training.beat]]
id = "drive"
frog = [5, 4]
say = ["frog-hello", "frog-drive", "frog-flags"]
nudge = "frog-flags-nudge"
done = { flags = 3 }

[[training.beat]]
id = "supply"
frog = [13, 4]
say = ["frog-crates", "frog-health"]
nudge = "frog-crates-nudge"
done = { collect = "ammo" }

[[training.beat]]
id = "fire"
frog = [23, 6]
say = ["frog-fire", "frog-materials", "frog-iron"]
nudge = "frog-fire-nudge"
done = { destroyed = [[25, 5], [25, 6], [25, 7]] }

[[training.beat]]
id = "through"
frog = [34, 6]
say = ["frog-wall"]
done = { past_col = 28 }

[[training.beat]]
id = "frog"
frog = [34, 6]
say = ["frog-pad"]
nudge = "frog-kit-nudge"
start = { shoot_frog = "east", drop = [{ kind = "frog_health", at = [31, 10] }] }
done = { collect = "frog_health" }

[[training.beat]]
id = "enemy"
frog = [34, 6]
say = ["frog-enemy", "frog-line-up"]
nudge = "frog-enemy-nudge"
start = { roll_in = [{ tank = "scout", ai = "dummy", after = 1.5 }] }
done = { wrecks = 1 }

[[training.beat]]
id = "shield"
frog = [34, 6]
say = ["frog-shield", "frog-shoots-back"]
nudge = "frog-wave-nudge"
start = { drop = [{ kind = "shield", at = [31, 4] }], roll_in = [{ tank = "scout", after = 6.0 }] }
done = { wrecks = 1 }
