# portals - the shipped portal map (docs/teleporting.md). Hand-authored:
# re-saving from the map editor would drop these comments.
#
# Three portals in a triangle - two up in the corners, one down at the
# bottom centre - each with a clear 3x3 of ground. Four 2x2 brick blocks
# ring the centre where the player starts with the frog just above; two
# short iron walls beside the corner portals make each of them a real
# shortcut around the wall rather than a detour. Enemies spawn in the
# border band and can hop from a corner straight into the middle; the
# player can hop out of a pincer through the bottom one and come up behind
# it. Where a tank comes out is random, so a portal is a gamble for both
# sides. Health top centre, ammo in the bottom corners, a shield bottom
# centre by the third portal.

