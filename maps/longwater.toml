# longwater - a fort on the shore of the Long Water, and a country to hold
# round it: the first big field made for the follow camera
# Laid out region by region and kept as a file: edit it like any other map,
# but re-saving from the map editor would drop these comments. Level tables
# as dotted keys on purpose - a `[spawn]` header would swallow every
# `cells.` line after it.
#
# Free play, not a level. 112 x 63 cells: under the follow camera
# (docs/large-maps-follow-camera.md) about three phone screens across and
# four down, eight 40 x 22.5 views of a monitor played alone - every gate a
# walk from the fort but no region a long way from the next.
#
# Protect on the waves plan: six waves of 3 to 8 tanks, light to super,
# rolling in through the six gates north of the water, each outside the
# fort's sight box and a 14 to 19 s walk from it down the roads. The two
# at the ends of the south road, 11 s out, are the way back in for a fallen
# seat. A room sizes the waves to its seats, one to four of them.
#
# The Long Water runs right across the middle, deep enough that no hull
# crosses it and every shell does. It is crossed at a shallow ford at each
# end and by two causeways either side of the fort, which stands on its
# south shore: iron towers, a brick curtain, a walled basin on the water
# whose moles look north across the lake, the barracks, and the frog's
# garden with its two ponds behind them. Shield, frog health, ammo and
# health inside the walls.
#
# North of the water, from west to east: the west woods, cut by the ride
# down to the west ford and the track from the forest gate; the glass
# quarter - rows of glasshouses round an iron-framed palm house, plasma in
# the beds; the mill on its pond where the stream comes down out of the
# hills through a wood, the old chapel's ruins on the bank (missiles), the
# minigun by the mill lane; the brick town round its square and fountain,
# the laser on the town hall's steps, Market Street running straight down
# to the east ford; the oil depot on the shore, drums and an oil trail
# (flamethrower). A high road crosses the north, a lakeside road the north
# bank.
#
# South of the water: the fishing village and its piers and boats to the
# west, the farm to the east - farmhouse, pond, barn, orchard, fenced
# fields. The quay and the farm road lead into the fort's west and east
# gates.
#
# Whatever an enemy turns off its road to fetch - laser, plasma, minigun,
# missiles, speed and shield, and the health packs a shield may turn up
# beside - lies beyond every gate's leash (`enemy_leash_px` from where a
# wave comes onto the field), so a wave keeps to the roads. By the gates
# there is only ammo, and the depot's flamethrower, which no enemy wants.

version = 1
size = [112, 63]
tank = "longbow"
tank2 = "ravager"
mission.kind = "protect"
spawn.kind = "waves"
spawn.waves = 6
spawn.size = 3
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "super"

