# ai-crossfire-canyon - a desert keep under fire from three sides. Hand-authored (generated
# from an ASCII layout): re-saving from the map editor would drop these
# comments. Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
# 
# Destroy on the waves plan: five waves of 2, 3, 4, 5 and 6 tanks climbing
# light -> super through three gates on the top edge and two on each side
# (all clear of the iron walls, so every lane is straight).
# No gate on the bottom edge, so the bottom lane is the one quiet flank.
# The player holds a titan inside a brick keep (cols 14-24, rows 7-15) with
# glass slits on every wall and three-cell doors top and bottom. Four iron
# L-walls outside funnel every roll-in into the lanes that meet at the
# keep, so the doors are always under crossfire. An oil drum sits in each
# side lane and a fuel drum beside each door lane for anyone who wants to make
# the approach worse. Laser and plasma in the top corners, minigun and
# shield in the bottom ones, health and ammo inside the keep, a speed-up
# on the quiet bottom lane.

version = 1
size = [40, 22.5]
theme = "desert"
tank = "titan"
mission.kind = "destroy"
spawn.kind = "waves"
spawn.waves = 5
spawn.size = 2
spawn.growth = 1
spawn.tier_start = "light"
spawn.tier_end = "super"

