# default-desert: the shipped desert battlefield (theme = "desert" - pale
# dust, packed-earth tracks, dry scrub; docs/desert-theme.md). Hand-authored:
# re-saving from the map editor would drop these comments. Level keys are
# dotted on purpose - a `[mission]`/`[spawn]` header would swallow every
# `cells.` line after it.
#
# Protect on the band plan, five tanks, the scout (the desert chassis).
# North to south:
#   - Two caravan tracks come in off the north edge: one winds round the
#     west side of the oasis and into the shrine, the other drops down the
#     east side to the depot gate.
#   - The oasis at the centre: a reed bed (tall grass, the only cover in
#     the open) between two tree clumps and two pines, the frog health pack
#     in the middle of it. Whoever wants it sits in the reeds to take it.
#   - A ruined fort in the west: iron corner towers, a brick curtain with a
#     three-cell breach on the north and east sides, the minigun in the
#     yard.
#   - A fuel depot in the east: a fenced yard of four pinned fuel drums with
#     the plasma pickup between them, and an oil trail running out of the
#     gate down to a sandbag berm with a fifth drum in it. One shot into the
#     yard lights the trail and blows the berm - a trap either side can
#     spring, on itself as easily as on the other.
#   - The frog's shrine at the bottom centre: two brick piers with the frog
#     between them, sandbags on the flanks, the player's start just
#     outside. A ruined wooden hut in the south-west corner.
# Every lane is at least two nav cells wide: the nav grid pads a solid
# cell one cell to its left and above, so obstacles stand three free cells
# apart and each breach is three cells. `cargo test --lib maplint` holds
# this map to zero errors like default.toml.
# Pickups: health on both wings, ammo north / south-west / south-east,
# speed-up on the north edge, shield and laser in the far corners, the
# flamethrower by the shrine's east flank.

