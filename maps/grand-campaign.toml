# grand-campaign - the big one: river valley, town, fort, oil depot, forest and portals
# Hand-authored: re-saving from the map editor would drop these comments.
# Level tables as dotted keys on purpose - a `[spawn]` header would
# swallow every `cells.` line after it.
#
# Protect on the waves plan: seven waves of 3 to 9 tanks, light to super,
# rolling in through six gates on the north, east and south edges. The largest
# field in the set, and every system in the game on it: a river running out of
# the northern hills into a lake and on to the south edge, a walled fort on
# the lake shore where the frog lives, a market town to the north-east, an oil
# depot wired with fuses to the south-east, a pine forest to the south-west.
#
# A pair of portals links the forest to the depot for a fast flank. Laser and
# missiles in the town, flamethrower at the depot, shield and frog health in
# the fort, health and ammo along the roads.

