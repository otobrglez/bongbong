name: TestFlight

# Builds the iOS app and uploads it to App Store Connect, from where it
# reaches TestFlight - the CI side of `just ios-testflight`
# (tools/ios/testflight.sh; CLAUDE.md's iOS section). Same tag trigger as
# release.yml and cloudflare-deploy.yml, so one `git tag vX.Y.Z && git push
# --tags` ships the native archives, the web build and a TestFlight build
# together; a manual run uploads the picked ref.
#
# **A pull request labelled `ios`** uploads a build of itself too, so a
# change can be played on a phone before it merges: on the label being
# added and on every push while it is on. It builds the merge ref the PR's
# web and room server previews build (pr-preview.yml, pr-server.yml), so the
# three speak the same protocol. It is a version of its own,
# MAJOR.MINOR.<10000 + PR> (PR 68 on 0.2.x is 0.2.10068), so TestFlight
# lists the PR's builds as their own train rather than as the newest build
# of a release's version, and its build number carries the PR as a third
# component (`YYYYMMDD.HHMM.<PR>`) - tools/ios/version.sh, which says why.
# A sticky comment on the PR names the build. Closing the
# PR expires every build of it (the `expire` job), which takes it off
# testers' TestFlight apps; App Store Connect keeps it listed as expired,
# since a build cannot be deleted. Same-repo PRs only: a fork's run gets no secrets - never "fix" that with
# pull_request_target, which would hand untrusted code the signing key.
#
# Signing needs nothing on the runner: xcodebuild -exportArchive signs with
# Apple's cloud-managed distribution certificate, authenticated by the App
# Store Connect API key (Admin role). The build number is the UTC time
# (tools/ios/version.sh), so every run uploads a new build; a release's
# version is Cargo.toml's.
#
# Requires repo secrets (App Store Connect > Users and Access > Integrations):
#   ASC_KEY_ID      the API key's ID
#   ASC_ISSUER_ID   the team's issuer ID
#   ASC_KEY_P8      the contents of AuthKey_<ASC_KEY_ID>.p8
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    types: [labeled, synchronize, reopened, closed]
  workflow_dispatch:

env:
  # Pinned to devenv.nix's languages.rust.version.
  RUST_VERSION: 1.98.1
  # The Xcode the local builds use; tools/ios/env.sh reads it.
  BONGBONG_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  BONGBONG_IOS_TEAM: PFET672VQB
  CARGO_TERM_COLOR: always

jobs:
  upload:
    # A pull request only while it is open and carries the `ios` label, and
    # only for the label itself being added (not every other label), from
    # this repo.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.state == 'open' &&
       contains(github.event.pull_request.labels.*.name, 'ios') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ios'))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    # On the job rather than the workflow, so a PR run whose job is skipped
    # (no label, another label) takes no group and cancels nothing.
    # Releases: one upload at a time, because two builds stamped in the same
    # minute would carry the same build number and App Store Connect refuses
    # the second. A PR: its own group, a new push cancelling the build it
    # supersedes; its build numbers cannot meet a release's or another PR's,
    # since the PR number is in them.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('testflight-pr-{0}', github.event.pull_request.number) || 'testflight' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version scheme
        run: ./tools/ios/version_test.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: testflight-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: testflight-cargo-${{ env.RUST_VERSION }}-

      # SDL3 and raylib for the device slice (tools/setup_ios.sh), the slow
      # part of a cold run. The key covers everything that decides what is
      # built: the script (SDL tag and options), the raylib patch, and
      # Cargo.lock (the sola-raylib-sys tree raylib is built from).
      - name: Cache SDL3 + raylib
        id: ios-libs
        uses: actions/cache@v6
        with:
          path: ~/.local/share/bongbong-ios/ios
          key: testflight-ios-libs-${{ hashFiles('tools/setup_ios.sh', 'tools/ios/raylib-sdl-highdpi.patch', 'Cargo.lock') }}-xcode26.3

      - name: Build SDL3 + raylib
        if: steps.ios-libs.outputs.cache-hit != 'true'
        run: |
          cargo fetch
          SLICE=ios ./tools/setup_ios.sh

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [[ -n "$ASC_KEY_ID" && -n "$ASC_KEY_P8" ]] || { echo "::error::ASC_KEY_ID and ASC_KEY_P8 secrets are required"; exit 1; }
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Build, sign and upload
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Empty outside a pull request: a release's version and build.
          BONGBONG_IOS_PR: ${{ github.event.pull_request.number }}
        run: |
          ./tools/ios/testflight.sh
          PB=/usr/libexec/PlistBuddy
          PLIST=target/ios-device/BongBong.app/Info.plist
          VERSION=$("$PB" -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$("$PB" -c "Print :CFBundleVersion" "$PLIST")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Uploaded **$VERSION ($BUILD)** to App Store Connect; it reaches TestFlight once processed." >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the TestFlight build on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.upload.outputs.version }}
          BUILD: ${{ steps.upload.outputs.build }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- bongbong-pr-testflight -->';
            const body = [
              marker,
              `📱 **TestFlight build ${process.env.VERSION} (${process.env.BUILD})** uploaded from ${sha}.`,
              '',
              'It shows up in the TestFlight app once App Store Connect has processed it (usually a few minutes).',
              `Version ${process.env.VERSION} is this PR's own (10000 + #${pr}), so its builds are listed apart from the releases' and every other PR's.`,
              `Remove the \`ios\` label to stop uploading on every push.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

      - name: Keep the export log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-export-log
          path: target/ios-device/export.log
          if-no-files-found: ignore

      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect

  # A closed PR's builds come off TestFlight: every unexpired build whose
  # number ends in `.<PR>` is expired through the App Store Connect API.
  # Runs on every same-repo close, label or not, so a label removed before
  # the close still leaves nothing behind (a PR that never uploaded finds
  # nothing). It shares the PR's upload group, so closing cancels an upload
  # still in flight; one that got far enough to reach App Store Connect is
  # waited for, because a build still processing cannot be expired yet.
  expire:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
    concurrency:
      group: testflight-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Expire this PR's TestFlight builds
        uses: actions/github-script@v9
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.otobrglez.bongbong
        with:
          script: |
            const crypto = require('crypto');
            const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, BUNDLE_ID } = process.env;
            if (!ASC_KEY_ID || !ASC_ISSUER_ID || !ASC_KEY_P8) {
              core.setFailed('ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets are required');
              return;
            }
            const pr = context.payload.pull_request.number;
            const key = crypto.createPrivateKey(ASC_KEY_P8);
            const b64 = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
            // A fresh token per call: they live at most 20 minutes and the wait below can outlast one.
            const token = () => {
              const now = Math.floor(Date.now() / 1000);
              const head = b64({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' });
              const body = b64({ iss: ASC_ISSUER_ID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' });
              const sig = crypto.sign('sha256', Buffer.from(`${head}.${body}`), { key, dsaEncoding: 'ieee-p1363' });
              return `${head}.${body}.${sig.toString('base64url')}`;
            };
            const asc = async (method, path, payload) => {
              const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
                method,
                headers: { Authorization: `Bearer ${token()}`, 'Content-Type': 'application/json' },
                body: payload && JSON.stringify(payload),
              });
              const text = await res.text();
              if (!res.ok) throw new Error(`${method} ${path}: ${res.status} ${text}`);
              return text ? JSON.parse(text) : {};
            };

            const apps = await asc('GET', `/v1/apps?filter[bundleId]=${BUNDLE_ID}&fields[apps]=bundleId`);
            const app = apps.data.find(a => a.attributes.bundleId === BUNDLE_ID);
            if (!app) { core.setFailed(`no App Store Connect app for ${BUNDLE_ID}`); return; }

            // Release builds are `YYYYMMDD.HHMM`; a PR's alone have a third part, its number.
            const ours = (b) => {
              const v = b.attributes.version.split('.');
              return v.length === 3 && v[2] === String(pr);
            };
            const expired = [];
            const deadline = Date.now() + 20 * 60 * 1000;
            for (;;) {
              const list = await asc('GET', `/v1/builds?filter[app]=${app.id}&filter[expired]=false`
                + '&sort=-uploadedDate&limit=200&fields[builds]=version,processingState,expired');
              const builds = list.data.filter(ours);
              const waiting = [];
              for (const b of builds) {
                const { version, processingState } = b.attributes;
                if (processingState === 'PROCESSING') { waiting.push(version); continue; }
                await asc('PATCH', `/v1/builds/${b.id}`,
                  { data: { type: 'builds', id: b.id, attributes: { expired: true } } });
                expired.push(version);
                core.info(`expired ${version} (${processingState})`);
              }
              if (waiting.length === 0) break;
              if (Date.now() > deadline) {
                core.warning(`still processing, left to expire on their own after 90 days: ${waiting.join(', ')}`);
                break;
              }
              core.info(`waiting for ${waiting.join(', ')} to finish processing`);
              await new Promise(r => setTimeout(r, 60 * 1000));
            }
            core.summary.addRaw(expired.length
              ? `Expired TestFlight builds: ${expired.join(', ')}`
              : 'No TestFlight build of this PR to expire.').write();

            const marker = '<!-- bongbong-pr-testflight -->';
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!existing) return; // never uploaded - nothing to mark
            const body = [
              marker,
              expired.length
                ? `🧹 This PR's TestFlight builds are expired and gone from TestFlight: ${expired.join(', ')}.`
                : '🧹 This PR is closed; no TestFlight build of it was left to expire.',
            ].join('\n');
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
