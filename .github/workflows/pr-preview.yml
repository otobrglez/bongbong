name: PR Preview

# Deploys every open PR as its own ephemeral Cloudflare Worker
# (`bongbong-pr-<N>`, static assets from site/dist) so the game can be played
# on its workers.dev subdomain before merging. The worker is deployed from
# wrangler.toml under a per-PR `--name`; wrangler.toml names no routes, so
# the preview gets the workers.dev URL and nothing else.
# The preview URL is posted/updated as a sticky PR comment; when the PR
# closes (merged or not) the worker is deleted. Production (the "bongbong"
# worker serving bongbong.io) is never touched — previews only ever own
# `bongbong-pr-<N>`.
#
# Requires the same repo secrets as cloudflare-deploy.yml:
#   CLOUDFLARE_API_TOKEN — account-level Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID
#
# Fork PRs: `pull_request` runs from forks get no secrets, so previews only
# deploy for same-repo branches. That's the intended security posture — do
# NOT switch this to `pull_request_target` to "fix" fork previews (it would
# hand untrusted PR code the Cloudflare token).
# No `branches` filter: a PR stacked on another feature branch gets a
# preview too. Workers are named per PR number and torn down per PR, so
# stacked PRs cannot collide.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One group per PR: a new push cancels the superseded build, and a close
# event cancels any in-flight build so teardown can't race a deploy that
# would re-create the worker after deletion.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Previews are the QA surface: build with the dev-tools feature so the
      # runtime tuning panel (docs/runtime-tuning-design.md) is available on
      # the preview. Production (cloudflare-deploy.yml) never passes this.
      - name: Build web (wasm + Astro site, dev-tools)
        uses: ./.github/actions/build-web
        with:
          cargo-features: --features dev-tools

      - name: Deploy preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name bongbong-pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- bongbong-pr-preview -->';
            const url = process.env.DEPLOYMENT_URL;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const rooms = `wss://rooms.bongbong.io/pr-${process.env.PR_NUMBER}`;
            const lines = [marker];
            if (url) {
              lines.push(`🎮 **Play this PR:** ${url}`);
              lines.push('', `Against this PR's room server: ${url}/?rooms=${rooms}`);
            } else {
              lines.push('🎮 This PR is deployed as the `bongbong-pr-' + process.env.PR_NUMBER + '` worker; its URL is in the deploy step\'s log.');
            }
            lines.push('', `Updated for ${sha}. The preview worker is deleted automatically when this PR closes.`);
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      # No checkout: the merge ref may already be gone for a closed PR, and
      # deletion only needs the worker name, not wrangler.toml. wrangler runs
      # non-interactively in CI, so `delete` needs no confirmation.
      # A missing worker (PR closed before any successful deploy, or secrets
      # absent on a fork PR) is treated as already-clean, not a failure; any
      # other wrangler error still fails the job visibly.
      - name: Delete preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: bongbong-pr-${{ github.event.pull_request.number }}
        run: |
          set +e
          out=$(npx wrangler@4 delete --name "$WORKER_NAME" 2>&1)
          status=$?
          echo "$out"
          if [[ $status -ne 0 ]]; then
            if grep -qiE 'not found|10007' <<<"$out"; then
              echo "Worker $WORKER_NAME does not exist — nothing to delete."
              exit 0
            fi
            exit $status
          fi

      - name: Mark preview comment as removed
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- bongbong-pr-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!existing) return; // no preview was ever deployed — nothing to mark
            const body = [
              marker,
              '🧹 The preview worker for this PR has been removed.',
            ].join('\n');
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
