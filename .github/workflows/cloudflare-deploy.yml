name: Cloudflare Deploy

# Builds the wasm/web build (same steps as `just build-web`, see justfile
# and CLAUDE.md's "Web / wasm build" section) and deploys target/web/ to
# the "bongbong" Cloudflare Worker (static assets, see wrangler.toml) that
# already serves bongbong.io. Mirrors release.yml's tag trigger so a
# `git tag vX.Y.Z && git push --tags` ships both the native binaries
# (release.yml, cargo-dist) and the web build (this workflow) together.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN — Workers Scripts:Edit permission on the target account
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

env:
  # Pinned to match devenv.nix's languages.rust.version.
  RUST_VERSION: "1.97.1"
  # Pinned to match tools/setup_emscripten.sh (newer emsdk's wasm-opt breaks
  # on wasm built with -fwasm-exceptions, which rustc 1.93+ emits).
  EMSDK_VERSION: "5.0.6"

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-emscripten

      - name: Cache cargo/emsdk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.local/share/emsdk
          key: cloudflare-web-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cloudflare-web-${{ runner.os }}-${{ env.EMSDK_VERSION }}-

      - name: Install emsdk
        run: |
          if [[ ! -d ~/.local/share/emsdk ]]; then
            git clone https://github.com/emscripten-core/emsdk.git ~/.local/share/emsdk
          fi
          cd ~/.local/share/emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Build web bundle
        run: |
          source ~/.local/share/emsdk/emsdk_env.sh
          cargo build --release --target wasm32-unknown-emscripten
          mkdir -p target/web
          rm -f target/web/*
          sed 's/__BONGBONG_BIN__/bongbong/g' web/shell.html > target/web/index.html
          cp target/wasm32-unknown-emscripten/release/bongbong.wasm target/web/
          cp target/wasm32-unknown-emscripten/release/bongbong.js target/web/
          cp target/wasm32-unknown-emscripten/release/deps/bongbong.data target/web/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
