name: Cloudflare Deploy

# Builds the wasm/web build and the Astro site around it (via the shared
# .github/actions/build-web composite action — same steps as `just build-web`,
# see justfile and site/README.md) and deploys site/dist/ to the "bongbong"
# Cloudflare Worker (static assets, see wrangler.toml) that already serves
# bongbong.io. Mirrors release.yml's tag trigger so a
# `git tag vX.Y.Z && git push --tags` ships both the native binaries
# (release.yml, cargo-dist) and the web build (this workflow) together.
# Per-PR preview deploys live in pr-preview.yml, built from the same
# composite action.
#
# Toolchain pins (Rust, emsdk) live in .github/actions/build-web/action.yml.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN — Workers Scripts:Edit permission on the target account
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Build web (wasm + Astro site)
        uses: ./.github/actions/build-web

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
