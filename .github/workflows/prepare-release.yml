# Prepare a release: Claude writes the release's entry in CHANGELOG.md from
# the pull requests merged since the last tag, and the workflow opens a
# "Release X.Y.Z" pull request with it. Review and edit the notes there,
# merge, then tag `vX.Y.Z` on master as before: cargo-dist puts the entry
# above the download table and makes its heading the release's title.
#
# Run it from the Actions tab (Prepare release -> Run workflow) or with
# `gh workflow run prepare-release.yml [-f version=X.Y.Z]`. Without a version
# it releases the one Cargo.toml already carries; with one it bumps Cargo.toml
# and Cargo.lock to it in the same PR. tools/release/ holds the gathering
# script and the instructions Claude follows; `just release-notes` runs the
# same two locally.
#
# The PR is opened with the workflow's own token, so no other workflow runs
# on it (GitHub's rule for GITHUB_TOKEN events) - it changes only the
# changelog and the version. Opening it needs "Allow GitHub Actions to create
# and approve pull requests" in the repository's Actions settings; without it
# the branch is still pushed and the run's summary links the PR to open.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). Empty: the version in Cargo.toml."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Work out the version
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | head -1)"
          version="${INPUT:-$current}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version (X.Y.Z)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged; pass the next version"; exit 1
          fi
          if [[ -f CHANGELOG.md ]] && grep -qE "^## $version( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md already has an entry for $version; edit it by hand"; exit 1
          fi
          since="$(git describe --tags --abbrev=0 --match 'v*')"
          {
            echo "version=$version"
            echo "current=$current"
            echo "since=$since"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (Cargo.toml has $current), changes since $since"

      - name: Bump Cargo.toml and Cargo.lock
        if: steps.v.outputs.version != steps.v.outputs.current
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          perl -0pi -e 's/(\[\[package\]\]\nname = "bongbong"\nversion = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.lock
          git diff --stat

      - name: Gather the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-notes
          tools/release/gather.sh "${{ steps.v.outputs.since }}" HEAD > target/release-notes/context.md
          wc -c target/release-notes/context.md

      - name: Write the notes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 20
            --allowedTools Read,Edit,Write,Glob,Grep
          prompt: |
            Follow the instructions in tools/release/notes-prompt.md.

            Version: ${{ steps.v.outputs.version }}
            Date: ${{ steps.v.outputs.date }}
            Context file: target/release-notes/context.md
            Changelog: CHANGELOG.md

      - name: Check the entry
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qE "^## $VERSION - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION - <date>' heading"; exit 1
          fi
          stray="$(git status --porcelain | grep -vE ' (CHANGELOG\.md|Cargo\.toml|Cargo\.lock)$' || true)"
          if [[ -n "$stray" ]]; then
            echo "::error::Claude touched more than the changelog:"; echo "$stray"; exit 1
          fi
          tools/release/entry.sh "$VERSION" > target/release-notes/entry.md
          cat target/release-notes/entry.md

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "Release $VERSION: the notes"
          git push --force origin "$branch"
          {
            echo "The notes for $VERSION, written by Claude from the pull requests merged since ${{ steps.v.outputs.since }}. Edit them here until they read right - push to this branch or use the web editor on \`CHANGELOG.md\`."
            echo
            echo "After merging: tag the merge commit and push the tag."
            echo
            echo '```'
            echo "git switch master && git pull && git tag v$VERSION && git push origin v$VERSION"
            echo '```'
            echo
            echo "---"
            echo
            cat target/release-notes/entry.md
          } > target/release-notes/pr.md
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file target/release-notes/pr.md >/dev/null || true
            url="$(gh pr view "$branch" --json url -q .url)"
          elif url="$(gh pr create --base master --head "$branch" --title "Release $VERSION" --body-file target/release-notes/pr.md)"; then
            :
          else
            url="https://github.com/${{ github.repository }}/compare/master...$branch?expand=1"
            echo "::warning::GitHub refused to let the workflow open the PR (Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Open it by hand: $url"
          fi
          {
            echo "### Release $VERSION"
            echo
            echo "Pull request: $url"
            echo
            cat target/release-notes/entry.md
          } >> "$GITHUB_STEP_SUMMARY"
