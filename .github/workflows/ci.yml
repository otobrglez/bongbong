# Test lane (Phase 6 of docs/gameplay-verification-design.md): cargo test
# (unit + determinism + map lint) plus the budgeted probe fixture sweeps.
# Deliberately separate from the deploy lanes (cloudflare-deploy.yml /
# pr-preview.yml) and never touching release.yml (cargo-dist-generated).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a PR supersedes the run in progress for it. Master's runs
# each finish: every one is a merge, and each saves the caches PRs read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The dev profile at opt-level 1 (dependencies stay at Cargo.toml's
      # opt-level 3): the game crate takes about a minute longer to compile
      # and its tests, the CPU thumbnail renders and the probe sweeps run
      # several times faster, which is the larger share of this job. Debug
      # assertions and overflow checks stay on, and the determinism pins
      # hold at either level. Line tables only keep the target small.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      # raylib-sys builds raylib from source - same system dev packages as
      # the release builds (keep in sync with dist-workspace.toml's
      # [dist.dependencies.apt]; that list came from sola-raylib's own
      # working CI, see CLAUDE.md's Releases section).
      - name: Install raylib build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libx11-dev libxcursor-dev
          libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      # Same pinned toolchain as .github/actions/build-web/action.yml -
      # keep the two (and devenv.nix's languages.rust.version) in sync.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      # Dependencies only: the workspace's own crates are rebuilt on every
      # run anyway, so they are left out of the saved cache. Keyed on the
      # lockfile, the manifests, the toolchain and the CARGO_* variables
      # above; a PR saves a copy of its own only when one of those differs
      # from master's.
      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      # The whole `cargo test --lib` suite: pathfind/shell-sweep/tile-seam/
      # weapon-queue units, the seeded-replay determinism guard, and the
      # static map linter with its supported-map gate.
      - name: cargo test
        run: cargo test --lib

      # Budgeted probe sweeps over every fixture map - headless, no display
      # needed. The justfile recipe holds the ceilings and the policy for
      # re-baselining them.
      - name: probe fixture sweeps
        run: just probe-fixtures

  # Builds the web client on every push to master, so its cargo and emsdk
  # cache is saved where every PR preview and release tag can read it (a
  # run reads only caches saved on its own ref or on master). Nothing is
  # deployed. Built with dev-tools, as the PR previews that read it most are.
  web-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build web (wasm + Astro site, dev-tools)
        uses: ./.github/actions/build-web
        with:
          cargo-features: --features dev-tools

  # Builds the room server image on every push to master, pushing nothing,
  # so the Dockerfile's dependency layer is in GitHub's cache (scope
  # `rooms-server`) where every PR's room server build and every release
  # tag's deploy can read it. Needs no Tailscale and no registry.
  rooms-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A plain `docker buildx build` is given no Actions runtime token.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build the room server image into the cache
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=rooms-server \
            --cache-to type=gha,scope=rooms-server,mode=max \
            --output type=cacheonly \
            .
